# Optional nginx site: serve the web UI at http://audio-md.local (no port).
# Install (see README "Domínio local"):
#   sudo cp audio-md.nginx.conf /etc/nginx/sites-available/audio-md.local
#   sudo ln -sf ../sites-available/audio-md.local /etc/nginx/sites-enabled/audio-md.local
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name audio-md.local;

    access_log /var/log/nginx/audio-md.access.log;
    error_log  /var/log/nginx/audio-md.error.log;

    # The app accepts uploads up to 1 GB; nginx's 1M default would 413 first.
    client_max_body_size 1g;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
